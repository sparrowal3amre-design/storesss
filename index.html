<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>StoreVIP Full</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: white;
}

/* HEADER */
header {
    display:flex;
    justify-content:space-between;
    padding:15px;
    background:rgba(255,255,255,0.05);
}

/* CONTAINERS */
section {
    padding: 15px;
}

/* INPUTS */
input {
    padding:10px;
    margin:5px;
    border:none;
    border-radius:10px;
}

/* BUTTON */
button {
    padding:10px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#3b82f6,#6366f1);
    color:white;
    cursor:pointer;
}

/* PRODUCTS */
#products {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
}

.card {
    background:rgba(255,255,255,0.06);
    padding:10px;
    border-radius:15px;
    text-align:center;
}

.card img {
    width:100%;
    border-radius:10px;
}

/* CART */
.cart {
    position:fixed;
    right:-350px;
    top:0;
    width:300px;
    height:100%;
    background:rgba(0,0,0,0.8);
    padding:10px;
    transition:0.3s;
}

.cart.show { right:0; }
</style>
</head>

<body>

<header>
<h2>📱 StoreVIP</h2>
<div>
<button onclick="toggleCart()">🛒</button>
<button onclick="logout()">🚪</button>
</div>
</header>

<!-- LOGIN -->
<section id="authBox">
<h3>تسجيل / دخول</h3>
<input id="email" placeholder="Email">
<input id="pass" placeholder="Password">
<br>
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</section>

<!-- ADMIN -->
<section id="adminBox" style="display:none">
<h3>⚙️ Admin - إضافة منتج</h3>
<input id="pname" placeholder="اسم المنتج">
<input id="pprice" placeholder="السعر">
<input id="pimg" placeholder="رابط الصورة">
<br>
<button onclick="addProduct()">إضافة</button>
</section>

<!-- PRODUCTS -->
<section>
<div id="products"></div>
</section>

<!-- CART -->
<div id="cart" class="cart">
<h3>🛒 Cart</h3>
<div id="cartItems"></div>
<h3 id="total"></h3>
<button onclick="checkout()">طلب</button>
</div>

<script>
/* ===== DATA ===== */
let users = JSON.parse(localStorage.getItem("users")) || [];
let currentUser = JSON.parse(localStorage.getItem("currentUser")) || null;
let products = JSON.parse(localStorage.getItem("products")) || [];
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let orders = JSON.parse(localStorage.getItem("orders")) || [];

/* ===== AUTH ===== */
function register(){
    let u = {
        email:email.value,
        pass:pass.value
    };
    users.push(u);
    localStorage.setItem("users",JSON.stringify(users));
    alert("تم التسجيل");
}

function login(){
    let found = users.find(u => u.email==email.value && u.pass==pass.value);
    if(found){
        currentUser = found;
        localStorage.setItem("currentUser",JSON.stringify(found));
        alert("تم الدخول");
        checkUI();
    } else alert("خطأ");
}

function logout(){
    localStorage.removeItem("currentUser");
    location.reload();
}

/* ===== ADMIN ===== */
function addProduct(){
    products.push({
        name:pname.value,
        price:pprice.value,
        image:pimg.value
    });
    localStorage.setItem("products",JSON.stringify(products));
    render();
}

/* ===== PRODUCTS ===== */
function render(){
    let box = document.getElementById("products");
    box.innerHTML="";

    products.forEach((p,i)=>{
        box.innerHTML+=`
        <div class="card">
            <img src="${p.image}">
            <h3>${p.name}</h3>
            <p>${p.price}$</p>
            <button onclick="add(${i})">Add</button>
        </div>`;
    });
}

/* ===== CART ===== */
function add(i){
    cart.push(products[i]);
    localStorage.setItem("cart",JSON.stringify(cart));
    updateCart();
}

function updateCart(){
    let box=document.getElementById("cartItems");
    box.innerHTML="";
    let total=0;

    cart.forEach(p=>{
        total+=Number(p.price);
        box.innerHTML+=`<p>${p.name} - ${p.price}$</p>`;
    });

    document.getElementById("total").innerText="Total: "+total+"$";
}

/* ===== CHECKOUT ===== */
function checkout(){
    if(!currentUser){ alert("سجل دخول"); return; }

    orders.push({
        user:currentUser.email,
        items:cart,
        total:cart.reduce((a,b)=>a+Number(b.price),0)
    });

    cart=[];
    localStorage.setItem("orders",JSON.stringify(orders));
    localStorage.setItem("cart",JSON.stringify(cart));

    updateCart();
    alert("تم الطلب");
}

/* ===== UI ===== */
function checkUI(){
    if(currentUser){
        authBox.style.display="none";
        adminBox.style.display="block";
    }
}

function toggleCart(){
    cartBox.classList.toggle("show");
}

/* ===== INIT ===== */
render();
updateCart();
checkUI();
</script>

</body>
</html>
