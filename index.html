<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>StoreVIP Pro</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle at top,#0f172a,#020617);
color:white;
}

header{
display:flex;
justify-content:space-between;
padding:15px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
}

button{
padding:10px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#3b82f6,#6366f1);
color:white;
cursor:pointer;
}

input{
padding:10px;
margin:5px;
border:none;
border-radius:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
padding:15px;
}

.card{
background:rgba(255,255,255,0.06);
padding:10px;
border-radius:15px;
text-align:center;
}

.card img{
width:100%;
border-radius:10px;
}

.cart{
position:fixed;
right:-350px;
top:0;
width:300px;
height:100%;
background:rgba(0,0,0,0.8);
padding:10px;
transition:0.3s;
overflow:auto;
}

.cart.show{ right:0; }
</style>
</head>

<body>

<header>
<h2>📱 StoreVIP PRO</h2>
<div>
<button onclick="toggleCart()">🛒</button>
<button onclick="logout()">🚪</button>
</div>
</header>

<!-- AUTH -->
<section id="authBox">
<h3>تسجيل دخول</h3>
<input id="email" placeholder="Email">
<input id="pass" placeholder="Password">
<br>
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</section>

<!-- ADMIN -->
<section id="adminBox" style="display:none">
<h3>⚙️ Admin Panel</h3>

<input id="pname" placeholder="اسم المنتج">
<input id="pprice" placeholder="السعر">
<input type="file" id="pimg">

<br>
<button onclick="addProduct()">إضافة منتج</button>
</section>

<!-- PRODUCTS -->
<div class="grid" id="products"></div>

<!-- CART -->
<div class="cart" id="cart">
<h3>🛒 Cart</h3>
<div id="cartItems"></div>
<h3 id="total"></h3>
<button onclick="checkout()">Checkout</button>
</div>

<script>
/* ===== DATA ===== */
let users = JSON.parse(localStorage.getItem("users")) || [];
let currentUser = JSON.parse(localStorage.getItem("currentUser")) || null;
let products = JSON.parse(localStorage.getItem("products")) || [];
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let orders = JSON.parse(localStorage.getItem("orders")) || [];

/* ===== CLOUDINARY ===== */
function uploadImage(file){
let form=new FormData();
form.append("file",file);
form.append("upload_preset","storevip_upload");

return fetch("https://api.cloudinary.com/v1_1/YOUR_CLOUD_NAME/image/upload",{
method:"POST",
body:form
})
.then(r=>r.json())
.then(d=>d.secure_url);
}

/* ===== AUTH ===== */
function register(){
users.push({email:email.value,pass:pass.value});
localStorage.setItem("users",JSON.stringify(users));
alert("registered");
}

function login(){
let u=users.find(x=>x.email==email.value && x.pass==pass.value);
if(u){
currentUser=u;
localStorage.setItem("currentUser",JSON.stringify(u));
checkUI();
}
}

function logout(){
localStorage.removeItem("currentUser");
location.reload();
}

/* ===== ADMIN ===== */
function addProduct(){
let file=document.getElementById("pimg").files[0];

uploadImage(file).then(url=>{
products.push({
name:pname.value,
price:pprice.value,
image:url
});

localStorage.setItem("products",JSON.stringify(products));
render();
});
}

/* ===== PRODUCTS ===== */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach((p,i)=>{
box.innerHTML+=`
<div class="card">
<img src="${p.image}">
<h3>${p.name}</h3>
<p>${p.price}$</p>
<button onclick="add(${i})">Add</button>
</div>`;
});
}

/* ===== CART ===== */
function add(i){
cart.push(products[i]);
localStorage.setItem("cart",JSON.stringify(cart));
updateCart();
}

function updateCart(){
let box=document.getElementById("cartItems");
box.innerHTML="";
let total=0;

cart.forEach((p,idx)=>{
total+=Number(p.price);
box.innerHTML+=`
<p>${p.name} - ${p.price}$
<button onclick="removeItem(${idx})">X</button></p>`;
});

document.getElementById("total").innerText="Total: "+total+"$";
}

function removeItem(i){
cart.splice(i,1);
localStorage.setItem("cart",JSON.stringify(cart));
updateCart();
}

/* ===== CHECKOUT ===== */
function checkout(){
if(!currentUser) return alert("login first");

orders.push({
user:currentUser.email,
items:cart,
total:cart.reduce((a,b)=>a+Number(b.price),0)
});

cart=[];
localStorage.setItem("orders",JSON.stringify(orders));
localStorage.setItem("cart",JSON.stringify(cart));

updateCart();
alert("order done");
}

/* ===== UI CONTROL ===== */
function toggleCart(){
document.getElementById("cart").classList.toggle("show");
}

function checkUI(){
if(currentUser){
authBox.style.display="none";
adminBox.style.display="block";
}
}

/* INIT */
render();
updateCart();
checkUI();
</script>

</body>
</html>
