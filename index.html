<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>StoreVIP Pro</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle at top,#0f172a,#020617);
color:white;
}

header{
display:flex;
justify-content:space-between;
padding:15px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
}

section{
padding:15px;
}

input{
padding:10px;
margin:5px;
border:none;
border-radius:10px;
}

button{
padding:10px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#3b82f6,#6366f1);
color:white;
cursor:pointer;
}

#products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
}

.card{
background:rgba(255,255,255,0.06);
padding:10px;
border-radius:15px;
text-align:center;
}

.card img{
width:100%;
border-radius:10px;
}
</style>
</head>

<body>

<header>
<h2>📱 StoreVIP Pro</h2>
<button onclick="toggleAdmin()">⚙️ Admin</button>
</header>

<!-- ADMIN -->
<section id="admin" style="display:none">
<h3>إضافة منتج</h3>

<input id="name" placeholder="اسم المنتج">
<input id="price" placeholder="السعر">
<input type="file" id="image">

<br>
<button onclick="addProduct()">إضافة</button>
</section>

<!-- PRODUCTS -->
<section>
<div id="products"></div>
</section>

<script>
/* ===== DATA ===== */
let products = JSON.parse(localStorage.getItem("products")) || [];

/* ===== CLOUDINARY ===== */
function uploadImage(file){
let form = new FormData();
form.append("file", file);
form.append("upload_preset", "storevip_upload");

return fetch("https://api.cloudinary.com/v1_1/YOUR_CLOUD_NAME/image/upload",{
method:"POST",
body:form
})
.then(r=>r.json())
.then(d=>d.secure_url);
}

/* ===== ADD PRODUCT ===== */
function addProduct(){

let file = document.getElementById("image").files[0];

uploadImage(file).then(url=>{

products.push({
name:name.value,
price:price.value,
image:url
});

localStorage.setItem("products",JSON.stringify(products));

render();

alert("تم إضافة المنتج");
});
}

/* ===== RENDER ===== */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach(p=>{
box.innerHTML+=`
<div class="card">
<img src="${p.image}">
<h3>${p.name}</h3>
<p>${p.price}$</p>
</div>`;
});
}

/* ===== ADMIN TOGGLE ===== */
function toggleAdmin(){
let a=document.getElementById("admin");
a.style.display = a.style.display==="none"?"block":"none";
}

/* INIT */
render();
</script>

</body>
</html>
