<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول والتسجيل - فون إكسبريس</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <!-- Logo -->
      <div class="logo">
        <i class="fa-solid fa-mobile-screen-button"></i>
        <span>فون إكسبريس</span>
      </div>

      <!-- Login Tab -->
      <div id="loginTab">
        <h2>تسجيل الدخول</h2>

        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required>
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
        </div>

        <button class="auth-btn" onclick="login()">
          <i class="fa-solid fa-sign-in-alt"></i> تسجيل الدخول
        </button>

        <div class="auth-links">
          <p>ليس لديك حساب؟ <a href="#" onclick="switchToRegister(event)">إنشاء حساب جديد</a></p>
          <p><a href="index.html">العودة إلى الرئيسية</a></p>
        </div>
      </div>

      <!-- Register Tab -->
      <div id="registerTab" style="display: none;">
        <h2>إنشاء حساب جديد</h2>

        <div class="form-group">
          <label for="displayName">الاسم الكامل</label>
          <input type="text" id="displayName" placeholder="أدخل اسمك الكامل">
        </div>

        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required>
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" placeholder="أدخل كلمة المرور (6 أحرف على الأقل)" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">تأكيد كلمة المرور</label>
          <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور" required>
        </div>

        <button class="auth-btn" onclick="register()">
          <i class="fa-solid fa-user-plus"></i> إنشاء حساب
        </button>

        <div class="auth-links">
          <p>لديك حساب بالفعل؟ <a href="#" onclick="switchToLogin(event)">تسجيل الدخول</a></p>
          <p><a href="index.html">العودة إلى الرئيسية</a></p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { onAuthStateChanged, auth } from "./firebase.js";

    // Check if user is already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "index.html";
      }
    });

    // Tab switching functions
    window.switchToRegister = function(e) {
      e.preventDefault();
      document.getElementById("loginTab").style.display = "none";
      document.getElementById("registerTab").style.display = "block";
      
      // Clear form fields
      document.getElementById("email").value = "";
      document.getElementById("password").value = "";
      document.getElementById("displayName").value = "";
      document.getElementById("confirmPassword").value = "";
    };

    window.switchToLogin = function(e) {
      e.preventDefault();
      document.getElementById("registerTab").style.display = "none";
      document.getElementById("loginTab").style.display = "block";
      
      // Clear form fields
      document.getElementById("email").value = "";
      document.getElementById("password").value = "";
    };
  </script>

  <script type="module" src="auth.js"></script>

</body>
</html>
